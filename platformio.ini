; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs     =
  *_env.ini

[common]
build_flags       =
  -std=c2x
  -Og
  -g3
  -fno-reorder-blocks
  -Wall
  -Wextra
  -Werror
  -Wpedantic
  -mno-ms-bitfields
  -Wno-packed-bitfield-compat
build_unflags      =
extra_scripts      =
  lss.py
  copy_binaries.py

platform          = native

; Host-side simavr "plugin": loads an AVR ELF firmware, taps the UART0
; transmit IRQ and prints every byte to stdout. Stops when the firmware
; requests a reboot via the watchdog (simavr reports cpu_Crashed).
[env:simavr-host]
extends           = common
build_flags       =
  ${common.build_flags}
  !pkg-config --cflags --libs simavr
